name: Generate npm lockfile once

on:
  push:
    branches: [fix-p2-p3-review-round-2]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-p2-p3-review-round-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use npm 11.6.0
        run: npm install -g npm@11.6.0 --no-audit --no-fund
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add npm lockfile"
          git push origin HEAD:fix-p2-p3-review-round-2
